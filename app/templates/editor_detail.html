<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <title>AI Editör</title>

    <style>

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f5f6fa;
            margin:40px;
        }

        .container{
            max-width:1100px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        h1{
            margin-top:0;
            margin-bottom:30px;
        }

        label{
            display:block;
            margin-top:18px;
            margin-bottom:6px;
            font-weight:bold;
        }

        input,
        textarea,
        select{

            width:100%;
            padding:10px;
            border:1px solid #ddd;
            border-radius:6px;
            box-sizing:border-box;
            font-size:15px;

        }

        textarea{

            resize:vertical;
            min-height:140px;

        }

        .row{

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;

        }

        .buttons{

            margin-top:30px;
            display:flex;
            gap:10px;

        }

        .btn{

            padding:12px 20px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            text-decoration:none;
            color:white;
            font-size:15px;

        }

        .save{

            background:#16a34a;

        }

        .back{

            background:#2563eb;

        }

    </style>

</head>

<body>

<div class="container">

    <h1>📝 Haber Editörü</h1>

    <form method="post">

        <label>Orijinal Başlık</label>

        <input
            type="text"
            value="{{ news.title }}"
            disabled
        >

        <label>Türkçe Başlık</label>

        <input
            type="text"
            name="translated_title"
            value="{{ news.translated_title or '' }}"
        >

        <label>Özet</label>

        <textarea
            name="summary"
        >{{ news.summary or '' }}</textarea>

        <div class="row">

            <div>

                <label>Marka</label>

                <input
                    type="text"
                    name="brand"
                    value="{{ news.brand or '' }}"
                >

            </div>

            <div>

                <label>Kategori</label>

                <input
                    type="text"
                    name="category"
                    value="{{ news.category or '' }}"
                >

            </div>

        </div>

        <div class="row">

            <div>

                <label>Önem Puanı</label>

                <input
                    type="number"
                    name="importance"
                    value="{{ news.importance or 0 }}"
                >

            </div>

            <div>

                <label>Durum</label>

                <input
                    type="text"
                    value="{{ news.status }}"
                    disabled
                >

            </div>

        </div>

        <label>Editör Notu</label>

        <textarea
            name="editor_note"
        >{{ news.editor_note or '' }}</textarea>

        <div class="buttons">

            <button
                class="btn save"
                type="submit">

                💾 Kaydet

            </button>

            <a
                href="/editor"
                class="btn back">

                ← Geri Dön

            </a>

        </div>

    </form>

</div>

</body>

</html>
