<div class="card shadow-sm border-0 mb-4">

    <div class="card-body">

        <form method="get" action="/editor">

            <div class="row g-3">

                <!-- Arama -->

                <div class="col-xl-3 col-lg-6">

                    <label class="form-label fw-semibold">

                        Haber Ara

                    </label>

                    <input
                        type="text"
                        name="keyword"
                        value="{{ request.query_params.get('keyword','') }}"
                        class="form-control"
                        placeholder="Başlık, özet veya anahtar kelime...">

                </div>

                <!-- Marka -->

                <div class="col-xl-2 col-lg-6">

                    <label class="form-label fw-semibold">

                        Marka

                    </label>

                    <select
                        class="form-select"
                        name="brand">

                        <option value="">Tümü</option>

                        {% for brand in brands %}

                        <option
                            value="{{ brand }}"
                            {% if request.query_params.get('brand')==brand %}selected{% endif %}>

                            {{ brand }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Kategori -->

                <div class="col-xl-2 col-lg-6">

                    <label class="form-label fw-semibold">

                        Kategori

                    </label>

                    <select
                        class="form-select"
                        name="category">

                        <option value="">Tümü</option>

                        {% for category in categories %}

                        <option
                            value="{{ category }}"
                            {% if request.query_params.get('category')==category %}selected{% endif %}>

                            {{ category }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Durum -->

                <div class="col-xl-2 col-lg-6">

                    <label class="form-label fw-semibold">

                        Durum

                    </label>

                    <select
                        class="form-select"
                        name="status">

                        <option value="">Tümü</option>

                        <option value="new">Yeni</option>

                        <option value="ai_ready">AI Hazır</option>

                        <option value="editor_review">Editör</option>

                        <option value="instagram_draft">Instagram Taslak</option>

                        <option value="instagram_ready">Instagram Hazır</option>

                        <option value="scheduled">Planlandı</option>

                        <option value="published">Yayınlandı</option>

                        <option value="archived">Arşiv</option>

                    </select>

                </div>

                <!-- Butonlar -->

                <div class="col-xl-3 d-flex align-items-end">

                    <button
                        type="submit"
                        class="btn btn-primary me-2">

                        <i class="bi bi-search me-1"></i>

                        Filtrele

                    </button>

                    <a
                        href="/editor"
                        class="btn btn-outline-secondary">

                        <i class="bi bi-x-circle me-1"></i>

                        Temizle

                    </a>

                </div>

            </div>

        </form>

    </div>

</div>
